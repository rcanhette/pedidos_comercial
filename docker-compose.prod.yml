services:
  postgres:
    image: postgres:17-alpine
    container_name: pedidos-comercial-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - pedidos_comercial_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pedidos-comercial-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start"

  caddy:
    image: caddy:2-alpine
    container_name: pedidos-comercial-caddy
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - pedidos_comercial_caddy_data:/data
      - pedidos_comercial_caddy_config:/config
    depends_on:
      - app

volumes:
  pedidos_comercial_postgres_data:
  pedidos_comercial_caddy_data:
  pedidos_comercial_caddy_config:
