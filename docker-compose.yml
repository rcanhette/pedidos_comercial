services:
  postgres:
    image: postgres:17-alpine
    container_name: sistema-pedidos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema_pedidos}
      POSTGRES_USER: ${POSTGRES_USER:-sistema_pedidos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - sistema_pedidos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sistema_pedidos} -d $${POSTGRES_DB:-sistema_pedidos}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sistema_pedidos_postgres_data:
